AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CampusFlow AI - AWS Serverless Architecture
  Intelligent Campus Service Navigator, Regulated Emergency Quota & Queue Orchestrator

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.11
    Environment:
      Variables:
        SERVICES_TABLE: !Ref ServicesTable
        QUEUES_TABLE: !Ref QueuesTable
        EMERGENCY_TABLE: !Ref EmergencyRequestsTable
        APPOINTMENTS_TABLE: !Ref AppointmentsTable
        DIGITAL_REQ_TABLE: !Ref DigitalRequestsTable
        STAFF_TABLE: !Ref StaffTable
        DOCS_BUCKET_NAME: !Ref StudentDocsBucket
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Resources:
  # ==========================================
  # API GATEWAY REST API
  # ==========================================
  CampusFlowApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # ==========================================
  # S3 BUCKET (Student Supporting Documents)
  # ==========================================
  StudentDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'campusflow-student-docs-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['GET', 'PUT', 'POST', 'HEAD']
            AllowedOrigins: ['*']
            MaxAge: 3000

  # ==========================================
  # LAMBDA FUNCTIONS
  # ==========================================
  NavigatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/navigator/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref QueuesTable
        - DynamoDBReadPolicy:
            TableName: !Ref StaffTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        NavigatorApi:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/navigator
            Method: POST

  EmergencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/emergency/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmergencyRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ServicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QueuesTable
      Events:
        GetEmergency:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/emergency
            Method: GET
        PostEmergency:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/emergency
            Method: POST
        ReviewEmergency:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/emergency/review
            Method: PUT

  QueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/queue/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QueuesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ServicesTable
      Events:
        GetQueues:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/queue
            Method: GET
        PostQueue:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/queue
            Method: POST
        PatchQueue:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/queue/status
            Method: PATCH

  DigitalRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/digital_requests/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DigitalRequestsTable
        - S3CrudPolicy:
            BucketName: !Ref StudentDocsBucket
      Events:
        PresignedUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/digital/presigned-url
            Method: POST
        SubmitDigital:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/digital/submit
            Method: POST

  AppointmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/appointments/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        GetAppointments:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/appointments
            Method: GET
        PostAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref CampusFlowApi
            Path: /api/appointments
            Method: POST

  # ==========================================
  # DYNAMODB TABLES
  # ==========================================
  ServicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CampusFlow_Services
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serviceId
          AttributeType: S
      KeySchema:
        - AttributeName: serviceId
          KeyType: HASH

  QueuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CampusFlow_Queues
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

  EmergencyRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CampusFlow_EmergencyRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: emergencyId
          AttributeType: S
      KeySchema:
        - AttributeName: emergencyId
          KeyType: HASH

  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CampusFlow_Appointments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: appointmentId
          AttributeType: S
      KeySchema:
        - AttributeName: appointmentId
          KeyType: HASH

  DigitalRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CampusFlow_DigitalRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH

  StaffTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CampusFlow_Staff
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: staffId
          AttributeType: S
      KeySchema:
        - AttributeName: staffId
          KeyType: HASH

Outputs:
  ApiEndpoint:
    Description: "API Gateway Base URL"
    Value: !Sub "https://${CampusFlowApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  StudentDocsBucket:
    Description: "S3 Document Bucket Name"
    Value: !Ref StudentDocsBucket
